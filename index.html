function renderMap(){
  var el = document.getElementById('map'); el.innerHTML='';

  document.getElementById('map-title').textContent = names[CUR] + ' · 知识点地图(点一下开始练)';
  UNITS[CUR].forEach(function(u){
    var rec = DB.done[uid(u.id)];
    var pct = rec && rec.total>0 ? Math.round(rec.right/rec.total*100) : null;
    var cls = (pct!==null && pct<60) ? 'pt low' : 'pt';
    var bar = pct===null ? '' : '<span class="bar">'+pct+'%</span>';
    var s = document.createElement('span'); s.className = cls;
    s.innerHTML = u.name + bar + (rec?' ('+rec.total+'题)':'');

    el.appendChild(s);
  });
}

var QZ = null; var qi = 0; var qcount = 10;

    q.options.forEach(function(o, i){
      var lab = document.createElement('label');
      lab.innerHTML = '<input type="radio" name="opt" value="'+i+'" onchange="checkChoice(this)"> '+o;
      opts.appendChild(lab);
    });
    box.appendChild(opts);
  } else {
    var inp = document.createElement('input'); inp.className='ans'; inp.placeholder='把答案填在这里(数学可以填数字)';
    inp.id = 'ans-in';
    inp.onkeydown = function(e){ if(e.key==='Enter') submitBlank(); };
    box.appendChild(inp);
    var b = document.createElement('button'); b.className='btn'; b.style.marginTop='8px';
    b.textContent = '确认'; b.onclick = submitBlank;
    box.appendChild(b);
  }
}

function norm(s){
  return String(s).replace(/\s+/g,'').toLowerCase().replace(/[,.。、]/g,'');
}
function isRight(q, my){
  var ans = q.answer;
  if(typeof ans === 'string' && ans.includes('|')){
    return ans.split('|').some(function(a){ return norm(a) === norm(my); });
  }
  return norm(ans) === norm(my);
}

function finish(q, my, ok){
  var res = document.createElement('div');
  res.className = 'res ' + (ok ? 'ok' : 'no');
  res.innerHTML = (ok ? '✅ 答对啦! ' : '❌ 答错了,正确答案:'+q.answer) + (q.explain ? '<div class="exp">💡 '+q.explain+'</div>' : '');
  var box = document.getElementById('qbox');
  var old = box.querySelector('.res'); if(old) old.remove();
  box.appendChild(res);
  if(ok) QZ.right++;
  else {
    DB.wrong[QZ.pid] = DB.wrong[QZ.pid] || [];
    DB.wrong[QZ.pid].push({stem: q.stem, my: String(my), ans: q.answer, exp: q.explain||'', time: new Date().toLocaleDateString()});
    if(DB.wrong[QZ.pid].length > 50) DB.wrong[QZ.pid] = DB.wrong[QZ.pid].slice(-50);
  }
  var rec = DB.done[uid(QZ.pid)] || {right:0,total:0};
  rec.right += ok?1:0; rec.total += 1;
  DB.done[uid(QZ.pid)] = rec;
  save();
  var nb = document.getElementById('btn-next');
  nb.style.display = 'block';
  nb.textContent = qi+1 < QZ.arr.length ? '下一题 ▸' : '看结果 ✔';
}

function checkChoice(el){
  var q = QZ.arr[qi];
  var idx = el.value;
  var opt = q.options[idx];
  var my = opt.replace(/^[A-D][.、]\s*/,'');
  var ok = idx === ['A','B','C','D'].indexOf(q.answer);
  document.querySelectorAll('.opts label').forEach(function(l){ l.classList.remove('sel'); });
  el.parentElement.classList.add('sel');
  finish(q, my, ok);
}

function submitBlank(){
  var inp = document.getElementById('ans-in');
  if(!inp) return;
  var my = inp.value.trim();
  if(!my){ alert('先填答案再确认哦~'); return; }
  var q = QZ.arr[qi];
  finish(q, my, isRight(q, my));
}

function nextQ(){
  qi++;
  if(qi >= QZ.arr.length){
    var box = document.getElementById('qbox');
    box.innerHTML = '<div class="stem">本组完成!答对 '+QZ.right+'/'+QZ.arr.length+' 题 '+ (QZ.right===QZ.arr.length?'🎉 全对,太棒了!':(QZ.right>=QZ.arr.length*0.7?'👍 不错,继续加油!':'💪 错的题都在错题本里,复习一下~')) +'</div>';
    document.getElementById('btn-next').style.display='none';
    renderMap(); renderWrong(); renderReport();
    return;
  }
  document.getElementById('quiz-title').textContent = QZ.name + ' · 第 ' + (qi+1) + '/' + QZ.arr.length + ' 题';
  document.getElementById('btn-next').style.display='none';
  showQ();
}

function exitQuiz(){
  QZ = null;
  document.getElementById('quiz-card').classList.add('hide');
}

function renderWrong(){
  var el = document.getElementById('wrong');
  var names = {math:'数学', yw:'语文', yy:'英语'};
  var list = [];
  UNITS[CUR].forEach(function(u){
    var w = DB.wrong[u.id];
    if(w && w.length) w.forEach(function(x){ list.push({pid:u.id, name:u.name, x:x}); });
  });
  if(!list.length){ el.innerHTML = '<div style="color:#b8a888;font-size:13px;">还没有错题,继续保持!错了的题会自动收进来。</div>'; return; }
  el.innerHTML = list.map(function(it){
    return '<div class="wrong-item"><b>['+it.name+']</b> '+it.x.stem+'<br>我的答案:'+it.x.my+' → 正确答案:<b>'+it.x.ans+'</b>'+(it.x.exp?'<br>💡 '+it.x.exp:'')+'</div>';
  }).join('');
}

function renderReport(){
  var el = document.getElementById('report');
  var rows = [];
  var weak = [];
  UNITS[CUR].forEach(function(u){
    var rec = DB.done[uid(u.id)];
    if(!rec || !rec.total) return;
    var pct = Math.round(rec.right/rec.total*100);
    rows.push(u.name+': '+rec.right+'/'+rec.total+' ('+pct+'%)');
    if(pct < 60) weak.push(u.name+'('+pct+'%)');
  });
  if(!rows.length){ el.innerHTML = '<div style="color:#b8a888;font-size:13px;">还没有练习记录,先去知识点地图点一个开始练~</div>'; return; }
  el.innerHTML = '<p>已练知识点:</p>' + rows.map(function(r){ return '<p>· '+r+'</p>'; }).join('');
  if(weak.length){
    el.innerHTML += '<div class="lowwarn">⚠️ 弱项(正确率低于60%):'+weak.join('、')+'——这些优先再练一遍</div>';
  } else {
    el.innerHTML += '<div class="lowwarn" style="background:#eaf5ee;border-color:#b7dfc3;color:#1e8449;">✅ 目前没有弱项,学得很扎实!</div>';
  }
}

load(); renderMap(); renderWrong(); renderReport();
</script>
